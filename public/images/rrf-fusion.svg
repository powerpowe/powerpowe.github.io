<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="BM25와 Dense 랭킹을 RRF로 융합하는 과정">
  <!-- Mid-tone palette on purpose: an <img> cannot inherit the page's theme
       colours, so these are chosen to read on both the light and dark
       backgrounds rather than matching either exactly. -->
  <style>
    .lbl { font: 600 11px ui-monospace, monospace; fill: #8a919d; letter-spacing: .12em; }
    .doc { font: 400 12px ui-sans-serif, system-ui, sans-serif; fill: #6f7885; }
    .hit { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #4c46d6; }
    .box { fill: none; stroke: #b9bec7; stroke-width: 1; }
    .arrow { stroke: #b9bec7; stroke-width: 1; fill: none; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#b9bec7"/>
    </marker>
  </defs>

  <text x="20" y="24" class="lbl">BM25</text>
  <rect x="12" y="34" width="150" height="112" rx="4" class="box"/>
  <text x="24" y="58" class="doc">1 · 논문 A</text>
  <text x="24" y="82" class="doc">2 · 논문 D</text>
  <text x="24" y="106" class="hit">3 · 논문 C</text>
  <text x="24" y="130" class="doc">4 · 논문 B</text>

  <text x="20" y="184" class="lbl">DENSE</text>
  <rect x="12" y="194" width="150" height="52" rx="4" class="box"/>
  <text x="24" y="218" class="hit">1 · 논문 C</text>
  <text x="24" y="238" class="doc">2 · 논문 A</text>

  <path d="M170 90 L246 122" class="arrow" marker-end="url(#a)"/>
  <path d="M170 214 L246 150" class="arrow" marker-end="url(#a)"/>

  <rect x="254" y="106" width="132" height="60" rx="4" class="box"/>
  <text x="272" y="132" class="lbl">RRF</text>
  <text x="272" y="152" class="doc">1 / (k + rank)</text>

  <path d="M394 136 L462 136" class="arrow" marker-end="url(#a)"/>

  <text x="478" y="24" class="lbl">FUSED</text>
  <rect x="470" y="34" width="150" height="112" rx="4" class="box"/>
  <text x="482" y="58" class="hit">1 · 논문 C</text>
  <text x="482" y="82" class="doc">2 · 논문 A</text>
  <text x="482" y="106" class="doc">3 · 논문 D</text>
  <text x="482" y="130" class="doc">4 · 논문 B</text>

  <text x="470" y="176" class="doc">양쪽에서 상위권인 C가 1위로</text>
</svg>
