<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글쓰기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  /* Mirrors the site's tokens so the preview reads close to the real thing. */
  :root {
    --bg: #fff; --surface: #f4f5f7; --fg: #0f1115; --muted: #565f6c;
    --faint: #8a919d; --line: #e4e7eb; --accent: #4c46d6;
    --sans: "Pretendard Variable", -apple-system, system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d10; --surface: #14171c; --fg: #e6e9ee; --muted: #98a1af;
      --faint: #6b7482; --line: #222831; --accent: #a8a2ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
  }
  button, input, textarea, select { font: inherit; color: inherit; }

  /* --- header ------------------------------------------------------------ */
  header { border-bottom: 1px solid var(--line); padding: 10px 16px; flex: none; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  input[type=text], input[type=date], select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 9px; min-width: 0;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #title { flex: 1; min-width: 220px; font-size: 15px; font-weight: 600; }
  #summary { flex: 1; min-width: 220px; }
  label.check { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
  .grow { flex: 1; }
  .btn {
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: .9; color: #fff; }
  #status { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  #status.ok { color: #2d8a5f; } #status.err { color: #c0392b; }
  /* Stays put while there are unsaved edits, unlike the transient status text. */
  #dot { color: #d08b1f; font-size: 11px; visibility: hidden; }
  #dot.on { visibility: visible; }
  #del:hover { border-color: #c0392b; color: #c0392b; }
  .hint { font-family: var(--mono); font-size: 11px; color: var(--faint); }

  /* --- toolbar ----------------------------------------------------------- */
  #toolbar {
    display: flex; gap: 2px; flex-wrap: wrap; padding: 6px 10px;
    border-bottom: 1px solid var(--line); flex: none; align-items: center;
  }
  #toolbar button {
    background: none; border: 0; border-radius: 5px; padding: 5px 9px;
    cursor: pointer; color: var(--muted); font-size: 13px; min-width: 30px;
  }
  #toolbar button:hover { background: var(--surface); color: var(--fg); }
  #toolbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 5px; }

  /* --- panes ------------------------------------------------------------- */
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  /* Preview folded away — the editor takes the full width. */
  body.solo main { grid-template-columns: 1fr; }
  body.solo #preview { display: none; }
  body.solo #editor { border-right: 0; }
  body.solo #previewBtn { color: var(--faint); opacity: .55; }
  #editor, #preview { min-height: 0; overflow: auto; }
  #editor {
    border: 0; border-right: 1px solid var(--line); resize: none;
    padding: 20px 22px; background: var(--bg); font-family: var(--mono);
    font-size: 13.5px; line-height: 1.75; tab-size: 2;
  }
  #preview { padding: 20px 26px; }
  body.dragging #editor { outline: 2px dashed var(--accent); outline-offset: -8px; }

  /* --- preview typography ------------------------------------------------ */
  #preview { font-size: 15px; line-height: 1.75; word-break: keep-all; }
  #preview > * + * { margin-top: 1.2em; }
  #preview h1, #preview h2, #preview h3 { line-height: 1.35; letter-spacing: -.02em; }
  #preview h1 { font-size: 1.7em; }
  #preview h2 { font-size: 1.35em; margin-top: 1.9em; border-top: 1px solid var(--line); padding-top: .9em; }
  #preview h3 { font-size: 1.12em; margin-top: 1.6em; }
  #preview a { color: var(--accent); }
  #preview img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; }
  #preview figure { margin: 0; }
  #preview figcaption, #preview em.cap { display: block; text-align: center; font-size: .82em; color: var(--faint); margin-top: .6em; }
  #preview blockquote { margin: 0; border-left: 2px solid var(--accent); padding-left: 1em; color: var(--muted); }
  #preview code { font-family: var(--mono); font-size: .87em; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: .1em .35em; }
  #preview pre { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1em; overflow-x: auto; }
  #preview pre code { background: none; border: 0; padding: 0; }
  #preview table { width: 100%; border-collapse: collapse; font-size: .95em; display: block; overflow-x: auto; }
  #preview th, #preview td { border-bottom: 1px solid var(--line); padding: .55em .7em; text-align: left; }
  #preview th { font-size: .8em; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
  #preview ul, #preview ol { padding-left: 1.35em; }
  #preview hr { border: 0; border-top: 1px solid var(--line); }
  #preview .katex-block { overflow-x: auto; padding: .3em 0; }

  /* --- table popover ------------------------------------------------------ */
  #tablePop {
    position: absolute; z-index: 20; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; box-shadow: 0 8px 24px rgb(0 0 0 / .12); display: none;
  }
  #tablePop.open { display: block; }
  #grid { display: grid; grid-template-columns: repeat(6, 20px); gap: 3px; }
  #grid div { width: 20px; height: 20px; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; }
  #grid div.on { background: var(--accent); border-color: var(--accent); }
  #gridLabel { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 7px; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="row">
    <select id="postList" title="글 열기"><option value="">+ 새 글</option></select>
    <input id="title" type="text" placeholder="제목" autocomplete="off">
    <span id="status"></span>
    <span id="dot" title="저장하지 않은 변경">●</span>
    <button class="btn" id="del" title="이 글 삭제" hidden>삭제</button>
    <button class="btn primary" id="save">저장</button>
  </div>
  <div class="row">
    <input id="slug" type="text" placeholder="슬러그 (URL)" style="width:190px" autocomplete="off">
    <input id="summary" type="text" placeholder="한 줄 요약" autocomplete="off">
    <input id="date" type="date" title="발행일">
    <input id="tags" type="text" placeholder="태그, 쉼표로" style="width:170px" autocomplete="off">
    <label class="check"><input id="draft" type="checkbox"> 초안</label>
  </div>
</header>

<div id="toolbar">
  <button data-md="h2" title="제목 2">H2</button>
  <button data-md="h3" title="제목 3">H3</button>
  <span class="sep"></span>
  <button data-md="bold" title="굵게 (Ctrl+B)"><b>B</b></button>
  <button data-md="italic" title="기울임 (Ctrl+I)"><i>I</i></button>
  <button data-md="code" title="인라인 코드">&lt;/&gt;</button>
  <span class="sep"></span>
  <button data-md="ul" title="목록">≡</button>
  <button data-md="ol" title="번호 목록">1.</button>
  <button data-md="quote" title="인용">&ldquo;</button>
  <span class="sep"></span>
  <button data-md="link" title="링크 (Ctrl+K)">🔗</button>
  <button id="tableBtn" title="표">⊞ 표</button>
  <button id="imageBtn" title="이미지 올리기">🖼 이미지</button>
  <span class="sep"></span>
  <button data-md="codeblock" title="코드 블록">코드</button>
  <button data-md="math" title="수식">∑</button>
  <button data-md="hr" title="구분선">―</button>
  <span class="grow"></span>
  <button id="previewBtn" title="미리보기 접기 (Ctrl+\)">◧ 미리보기</button>
  <span class="sep"></span>
  <span class="hint" id="counts"></span>
  <span class="sep"></span>
  <span class="hint">드롭 · Ctrl+V 로 이미지</span>
</div>

<main>
  <textarea id="editor" spellcheck="false" placeholder="여기에 글을 씁니다. 마크다운 그대로 쓰면 됩니다."></textarea>
  <div id="preview"></div>
</main>

<div id="tablePop">
  <div id="grid"></div>
  <div id="gridLabel">0 × 0</div>
</div>

<input type="file" id="filePicker" accept="image/*" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const ed = $("editor");

let dirty = false;
/** Slug the current post was loaded under; "" for an unsaved new post. */
let loadedSlug = "";
let known = [];

function markDirty(on = true) {
  dirty = on;
  $("dot").classList.toggle("on", on);
  if (on) scheduleBackup();
}

/** Same weighting as lib/posts.ts, so the estimate matches the published one. */
function updateCounts() {
  const text = ed.value;
  const cjk = (text.match(/[\uac00-\ud7a3\u4e00-\u9fff\u3040-\u30ff]/g) ?? []).length;
  const words = text.replace(/[\uac00-\ud7a3\u4e00-\u9fff\u3040-\u30ff]/g, " ")
    .split(/\s+/).filter(Boolean).length;
  const mins = Math.max(1, Math.round(cjk / 500 + words / 220));
  $("counts").textContent = `${text.length.toLocaleString()}자 · 약 ${mins}분`;
}

// --- status ----------------------------------------------------------------
let statusTimer;
function say(msg, kind = "") {
  $("status").textContent = msg;
  $("status").className = kind;
  clearTimeout(statusTimer);
  if (msg) statusTimer = setTimeout(() => ($("status").textContent = ""), 4000);
}

// --- preview ---------------------------------------------------------------
marked.setOptions({ gfm: true, breaks: false });

/**
 * Renders math *before* markdown, not after.
 *
 * marked runs first otherwise and mangles TeX on the way through: the two
 * underscores in `\text{enc}_q ... \text{enc}_d` become an <em>, and `<v_q,
 * v_d>` turns into a bogus tag. KaTeX then receives something that is no longer
 * the formula. So each span is lifted out, replaced by an inert placeholder
 * that markdown cannot touch, and pasted back rendered.
 */
function renderMath(src) {
  const slots = [];
  const stash = (tex, display) => {
    let html;
    try {
      html = katex.renderToString(tex, { displayMode: display, throwOnError: false });
    } catch (err) {
      html = `<code style="color:#c0392b">${tex}</code>`;
    }
    slots.push(display ? `<div class="katex-block">${html}</div>` : html);
    // Letters and digits only — anything with punctuation risks being eaten
    // by markdown before it can be swapped back.
    return `xMATHx${slots.length - 1}xENDx`;
  };

  // Fenced code first, so `$` inside a code sample is left alone.
  const code = [];
  src = src.replace(/```[\s\S]*?```|`[^`\n]*`/g, (m) => {
    code.push(m);
    return `xCODEx${code.length - 1}xENDx`;
  });

  src = src
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => stash(tex.trim(), true))
    .replace(/(?<!\\)\$([^$\n]+?)(?<!\\)\$/g, (_, tex) => stash(tex.trim(), false));

  src = src.replace(/xCODEx(\d+)xENDx/g, (_, i) => code[+i]);
  return { src, slots };
}

function render() {
  updateCounts();
  // Folded away: skip the markdown and KaTeX work entirely rather than
  // rendering into a hidden pane on every keystroke.
  if (document.body.classList.contains("solo")) return;

  let src = ed.value;

  // Match the site: a markdown title on an image becomes a caption.
  src = src.replace(/!\[([^\]]*)\]\(([^)\s]+)\s+"([^"]*)"\)/g,
    (_, alt, url, cap) => `![${alt}](${url})\n<em class="cap">${cap}</em>`);
  // Relative post images are served by this tool from content/blog/.
  src = src.replace(/\]\(\.\//g, "](/blog-assets/");

  const { src: masked, slots } = renderMath(src);
  const html = marked
    .parse(masked)
    .replace(/xMATHx(\d+)xENDx/g, (_, i) => slots[+i] ?? "");

  $("preview").innerHTML = html;
}

let renderTimer;
ed.addEventListener("input", () => {
  markDirty();
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 150);
});

// Keep the two panes roughly together while scrolling.
ed.addEventListener("scroll", () => {
  const p = ed.scrollTop / Math.max(1, ed.scrollHeight - ed.clientHeight);
  const pv = $("preview");
  pv.scrollTop = p * (pv.scrollHeight - pv.clientHeight);
});

// --- editing helpers -------------------------------------------------------
/**
 * All text insertion goes through execCommand.
 *
 * `setRangeText` and assigning `.value` both replace the content without
 * telling the browser, which wipes the native undo stack — Ctrl+Z stops
 * working the moment a toolbar button is used. `insertText` is deprecated but
 * it is still the only way to edit a textarea and keep undo intact.
 */
function insertText(text) {
  ed.focus();
  let ok = false;
  try {
    ok = document.execCommand("insertText", false, text);
  } catch {
    ok = false;
  }
  if (!ok) {
    const { selectionStart: s, selectionEnd: e } = ed;
    ed.setRangeText(text, s, e, "end");
  }
  markDirty();
  render();
}

/** Replaces the current selection, optionally reselecting part of the result. */
function replaceSelection(text, selectFrom = null, selectTo = null) {
  const start = ed.selectionStart;
  insertText(text);
  if (selectFrom !== null) {
    ed.setSelectionRange(start + selectFrom, start + (selectTo ?? selectFrom));
  }
}

function wrap(before, after = before, placeholder = "") {
  const { selectionStart: s, selectionEnd: e } = ed;
  const had = s !== e;
  const sel = had ? ed.value.slice(s, e) : placeholder;
  insertText(before + sel + after);
  // With nothing selected the placeholder is left highlighted to type over.
  if (!had) ed.setSelectionRange(s + before.length, s + before.length + sel.length);
}

/** Applies a prefix to every line the selection touches. */
function prefixLines(prefix) {
  const v = ed.value;
  const start = v.lastIndexOf("\n", ed.selectionStart - 1) + 1;
  let end = v.indexOf("\n", ed.selectionEnd);
  if (end === -1) end = v.length;

  const numbered = prefix === "1. ";
  const out = v
    .slice(start, end)
    .split("\n")
    .map((l, i) => (numbered ? `${i + 1}. ` : prefix) + l.replace(/^([#>\-*]+\s*|\d+\.\s*)/, ""))
    .join("\n");

  ed.setSelectionRange(start, end);
  insertText(out);
}

const ACTIONS = {
  h2: () => prefixLines("## "),
  h3: () => prefixLines("### "),
  bold: () => wrap("**", "**", "굵게"),
  italic: () => wrap("*", "*", "기울임"),
  code: () => wrap("`", "`", "코드"),
  ul: () => prefixLines("- "),
  ol: () => prefixLines("1. "),
  quote: () => prefixLines("> "),
  link: () => wrap("[", "](https://)", "링크 텍스트"),
  hr: () => replaceSelection("\n\n---\n\n"),
  math: () => wrap("$$\n", "\n$$", "a^2 + b^2 = c^2"),
  codeblock: () => wrap("```python title=\"example.py\"\n", "\n```", "code"),
};

document.querySelectorAll("#toolbar button[data-md]").forEach((b) =>
  b.addEventListener("click", () => ACTIONS[b.dataset.md]()));

const PREVIEW_KEY = "write.preview";

function setPreview(on) {
  document.body.classList.toggle("solo", !on);
  try { localStorage.setItem(PREVIEW_KEY, on ? "1" : "0"); } catch {}
  if (on) render();
}

$("previewBtn").addEventListener("click", () =>
  setPreview(document.body.classList.contains("solo")));

setPreview((() => {
  try { return localStorage.getItem(PREVIEW_KEY) !== "0"; } catch { return true; }
})());

document.addEventListener("keydown", (e) => {
  if (!(e.metaKey || e.ctrlKey)) return;
  const k = e.key.toLowerCase();
  if (e.key === "\\") { e.preventDefault(); setPreview(document.body.classList.contains("solo")); return; }
  if (k === "s") { e.preventDefault(); save(); }
  else if (k === "b") { e.preventDefault(); ACTIONS.bold(); }
  else if (k === "i") { e.preventDefault(); ACTIONS.italic(); }
  else if (k === "k") { e.preventDefault(); ACTIONS.link(); }
});

const LIST_ITEM = /^(\s*)(- \[[ x]\] |[-*] |\d+\. |> )(.*)$/;

ed.addEventListener("keydown", (e) => {
  // Tab indents instead of leaving the textarea — otherwise nested lists and
  // code blocks are unwritable without leaving the keyboard.
  if (e.key === "Tab") {
    e.preventDefault();
    if (e.shiftKey) {
      const v = ed.value;
      const start = v.lastIndexOf("\n", ed.selectionStart - 1) + 1;
      if (v.slice(start, start + 2) === "  ") {
        ed.setSelectionRange(start, start + 2);
        insertText("");
      }
    } else {
      insertText("  ");
    }
    return;
  }

  // Enter continues a list or quote, and an empty marker ends it.
  if (e.key === "Enter" && !e.shiftKey && ed.selectionStart === ed.selectionEnd) {
    const v = ed.value;
    const start = v.lastIndexOf("\n", ed.selectionStart - 1) + 1;
    const line = v.slice(start, ed.selectionStart);
    const m = line.match(LIST_ITEM);
    if (!m) return;

    e.preventDefault();
    const [, indent, marker, rest] = m;
    if (!rest.trim()) {
      // Second Enter on an empty item: drop the marker and leave the list.
      ed.setSelectionRange(start, ed.selectionStart);
      insertText("");
      return;
    }
    const next = /^\d+\. $/.test(marker)
      ? `${parseInt(marker, 10) + 1}. `
      : marker.replace(/\[x\]/, "[ ]");
    insertText(`\n${indent}${next}`);
  }
});

// --- table popover ---------------------------------------------------------
const ROWS = 6, COLS = 6;
const grid = $("grid"), pop = $("tablePop");
for (let i = 0; i < ROWS * COLS; i++) grid.appendChild(document.createElement("div"));

function paint(r, c) {
  [...grid.children].forEach((cell, i) => {
    cell.classList.toggle("on", (i % COLS) < c && Math.floor(i / COLS) < r);
  });
  $("gridLabel").textContent = `${c} × ${r}`;
}

grid.addEventListener("mousemove", (e) => {
  const i = [...grid.children].indexOf(e.target);
  if (i >= 0) paint(Math.floor(i / COLS) + 1, (i % COLS) + 1);
});
grid.addEventListener("click", (e) => {
  const i = [...grid.children].indexOf(e.target);
  if (i < 0) return;
  const rows = Math.floor(i / COLS) + 1, cols = (i % COLS) + 1;
  const head = "| " + Array.from({ length: cols }, (_, n) => `제목${n + 1}`).join(" | ") + " |";
  const rule = "|" + " --- |".repeat(cols);
  const body = Array.from({ length: rows }, () => "| " + Array(cols).fill("   ").join("| ") + "|").join("\n");
  replaceSelection(`\n${head}\n${rule}\n${body}\n\n`);
  pop.classList.remove("open");
});

$("tableBtn").addEventListener("click", (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  pop.style.left = `${r.left}px`;
  pop.style.top = `${r.bottom + 6}px`;
  pop.classList.toggle("open");
  paint(0, 0);
});
document.addEventListener("click", (e) => {
  if (!pop.contains(e.target) && e.target !== $("tableBtn")) pop.classList.remove("open");
});

// --- images ----------------------------------------------------------------
async function upload(file) {
  say(`올리는 중… ${file.name}`);
  const res = await fetch("/api/upload", {
    method: "POST",
    headers: { "x-filename": encodeURIComponent(file.name) },
    body: file,
  });
  const data = await res.json();
  if (!res.ok) { say(data.error, "err"); return; }
  replaceSelection(`\n![${file.name.replace(/\.[^.]+$/, "")}](./${data.file})\n`);
  say(`content/blog/${data.file}`, "ok");
}

async function uploadAll(files) {
  for (const f of files) if (f.type.startsWith("image/")) await upload(f);
}

$("imageBtn").addEventListener("click", () => $("filePicker").click());
$("filePicker").addEventListener("change", (e) => uploadAll(e.target.files));

["dragenter", "dragover"].forEach((t) =>
  document.addEventListener(t, (e) => { e.preventDefault(); document.body.classList.add("dragging"); }));
["dragleave", "drop"].forEach((t) =>
  document.addEventListener(t, (e) => { e.preventDefault(); if (t === "drop" || e.target === document.documentElement) document.body.classList.remove("dragging"); }));
document.addEventListener("drop", (e) => uploadAll(e.dataTransfer.files));

// Screenshots pasted straight from the clipboard.
ed.addEventListener("paste", (e) => {
  const files = [...(e.clipboardData?.items ?? [])]
    .filter((i) => i.kind === "file" && i.type.startsWith("image/"))
    .map((i) => i.getAsFile())
    .filter(Boolean);
  if (files.length) { e.preventDefault(); uploadAll(files); }
});

// --- crash recovery --------------------------------------------------------
/**
 * Mirrors the in-progress post to localStorage.
 *
 * The editor writes to disk only when told to, so a closed tab or a crash
 * would otherwise take everything since the last save. The backup is offered
 * back on load and dropped once the real file is written.
 */
const BACKUP_KEY = "write.backup";
let backupTimer;

function currentDoc() {
  return {
    slug: $("slug").value, title: $("title").value, summary: $("summary").value,
    date: $("date").value, tags: $("tags").value, draft: $("draft").checked,
    body: ed.value, loadedSlug, at: Date.now(),
  };
}

function scheduleBackup() {
  clearTimeout(backupTimer);
  backupTimer = setTimeout(() => {
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(currentDoc())); } catch {}
  }, 1000);
}

function clearBackup() {
  clearTimeout(backupTimer);
  try { localStorage.removeItem(BACKUP_KEY); } catch {}
}

function applyDoc(d) {
  $("title").value = d.title ?? ""; $("slug").value = d.slug ?? "";
  $("summary").value = d.summary ?? ""; $("date").value = (d.date ?? "").slice(0, 10);
  $("tags").value = d.tags ?? ""; $("draft").checked = !!d.draft; ed.value = d.body ?? "";
  loadedSlug = d.loadedSlug ?? "";
  if ($("slug").value) $("slug").dataset.touched = "1";
  $("del").hidden = !loadedSlug;
  render();
}

function offerBackup() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(BACKUP_KEY) ?? "null"); } catch {}
  if (!saved || (!saved.body?.trim() && !saved.title?.trim())) return false;

  const when = new Date(saved.at).toLocaleString("ko-KR");
  if (!confirm(`저장하지 않은 글이 있습니다 (${when}).\n\n"${saved.title || "제목 없음"}"\n\n복구할까요?`)) {
    clearBackup();
    return false;
  }
  applyDoc(saved);
  markDirty();
  say("복구됨 · 아직 저장 전입니다", "err");
  return true;
}

// --- load / save -----------------------------------------------------------
function slugify(s) {
  return s.trim().toLowerCase().replace(/[^\w\s가-힣-]/g, "").replace(/\s+/g, "-").slice(0, 60);
}

$("title").addEventListener("input", () => {
  if (!$("slug").dataset.touched) $("slug").value = slugify($("title").value);
  markDirty();
});
$("slug").addEventListener("input", () => { $("slug").dataset.touched = "1"; markDirty(); });
["summary", "date", "tags", "draft"].forEach((id) =>
  $(id).addEventListener("input", () => markDirty()));

async function refreshList(selected = "") {
  const { posts } = await (await fetch("/api/posts")).json();
  known = posts;
  $("postList").innerHTML =
    '<option value="">+ 새 글</option>' +
    posts.map((p) => `<option value="${p.slug}">${p.draft ? "◦ " : ""}${p.title}</option>`).join("");
  $("postList").value = selected;
}

async function load(slug) {
  if (dirty && !confirm("저장하지 않은 변경이 있습니다. 버리고 여시겠어요?")) {
    $("postList").value = $("slug").value;
    return;
  }
  clearBackup();
  if (!slug) {
    ["title", "slug", "summary", "tags"].forEach((id) => ($(id).value = ""));
    delete $("slug").dataset.touched;
    $("draft").checked = true;
    $("date").value = new Date().toISOString().slice(0, 10);
    ed.value = "";
    loadedSlug = ""; $("del").hidden = true;
    markDirty(false); render(); $("title").focus();
    return;
  }
  const p = await (await fetch(`/api/post?slug=${encodeURIComponent(slug)}`)).json();
  applyDoc({ ...p, loadedSlug: p.slug });
  markDirty(false);
}

$("postList").addEventListener("change", (e) => load(e.target.value));

async function save() {
  const target = slugify($("slug").value);

  // Never clobber another post without asking. Renaming the slug of an open
  // post is fine — the server removes the old file — but landing on top of a
  // *different* post is almost certainly a mistake.
  if (target && target !== loadedSlug && known.some((p) => p.slug === target)) {
    if (!confirm(`"${target}" 글이 이미 있습니다. 덮어쓸까요?`)) return;
  }

  const res = await fetch("/api/post", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...currentDoc(), oldSlug: loadedSlug }),
  });
  const data = await res.json();
  if (!res.ok) { say(data.error, "err"); return; }

  const renamed = loadedSlug && loadedSlug !== data.slug;
  loadedSlug = data.slug;
  $("del").hidden = false;
  markDirty(false);
  clearBackup();
  say(renamed ? `이름 바꿔 저장됨 · ${data.slug}.mdx` : `저장됨 · ${data.slug}.mdx`, "ok");
  refreshList(data.slug);
}
$("save").addEventListener("click", save);

$("del").addEventListener("click", async () => {
  if (!loadedSlug) return;
  if (!confirm(`"${loadedSlug}.mdx" 를 삭제할까요?\n\n이미지 파일은 남습니다.`)) return;
  const res = await fetch(`/api/post?slug=${encodeURIComponent(loadedSlug)}`, { method: "DELETE" });
  const data = await res.json();
  if (!res.ok) { say(data.error, "err"); return; }
  say(`삭제됨 · ${data.slug}.mdx`, "ok");
  markDirty(false);
  await refreshList();
  load("");
});

window.addEventListener("beforeunload", (e) => { if (dirty) e.preventDefault(); });

refreshList().then(() => { if (!offerBackup()) load(""); });
</script>
</body>
</html>
