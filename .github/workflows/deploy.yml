name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue instead of cancelling, so a push that
# lands mid-deploy still ships rather than being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Tailwind v4's oxide engine requires Node 20+.
          node-version: 22
          cache: npm

      - run: npm ci

      # `next typegen` (inside this script) writes next-env.d.ts, which is
      # gitignored and therefore absent on a fresh checkout. It carries the
      # `next/image-types/global` reference that makes `import x from
      # "…/foo.png"` type-check, so tsc fails without it.
      - run: npm run typecheck

      # `output: "export"` in next.config.ts writes the site to ./out
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
